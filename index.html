<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>

    <main>

    
    <section class="game-options-container" id="game-options-container">

      <form class="form-container" id="form-container">
        <div class="form-question-container">
          <h2 class="question-title">¿Cuántas preguntas quieres?</h2>
          <div>
            <label for="range-bar">Número</label>
            <input type="range" id="range-bar" max="30" min="5">
          </div>
        </div>

        <div class="form-question-container">
          <h2 class="question-title">¿Cuánto tiempo quieres por pregunta?</h2>
          <section id="timers">
            <div >
              <input type="radio" name="radio" id="10-seconds" value="10" checked>
              <label for="10-seconds">10 seconds</label>
            </div>
            <div>
              <input type="radio" name="radio" id="20-seconds" value="20">
              <label for="20-seconds">20 seconds</label>
            </div>
            <div>
              <input type="radio" name="radio" id="30-seconds" value="30">
              <label for="30-seconds">30 seconds</label>
            </div>
            <div>
              <input type="radio" name="radio" id="60-seconds" value="60">
              <label for="60-seconds">60 seconds</label>
            </div>
          </section>
        </div>
      

        <div class="form-question-container">
          <h2 class="question-title">¿Qué temas quieres que incluya?</h2>
          <span class="question-subtitle">Debes escoger al menos una opción</span>
          <section id="topics">
            <div>
              <input type="checkbox" id="science">
              <label for="science">Ciencia</label>
            </div>
            <div>
              <input type="checkbox" id="geography">
              <label for="geography">Geografía</label>
            </div>
            <div>
              <input type="checkbox" id="art">
              <label for="art">Arte</label>
            </div>
            <div>
              <input type="checkbox" id="history">
              <label for="history">Historia</label>
            </div>
            <div>
              <input type="checkbox" id="mythology">
              <label for="mythology">Mitologia</label>
            </div>
            <div>
              <input type="checkbox" id="culture">
              <label for="culture">Cultura general</label>
            </div>
          </section>
        </div>
        <div>
            <input type="submit" id="play-button" disabled>
        </div>
      </form>

    </section>

    <section class="question-container hide" id="question-container">
      <h2>Pregunta</h2>
      <div class="answer-container" id="answer-container">
        <span>Respuesta 1</span>
        <span>Respuesta 2</span>
        <span>Respuesta 3</span>
        <span>Respuesta 4</span>
      </div>
      <div id="count-down">Timer: 20s left</div>
    </section>

    <section class="results-container hide" id="results-container">
        <span>Acertaste x</span>
        <span>Fallaste x</span>
        <span>Faltaron x preguntas por responder</span>
    </section>

    </main>
    <script src="./js/scripts.js"></script>
  </body>
</html>
