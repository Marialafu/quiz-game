<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="history">
    <header class="header">
      <h1 class="title">QUIZ GAME</h1>
    </header>

    <mainc>
    
    <section class="game-options-container" id="game-options-container">

      <form class="form-container" id="form-container">
        <div class="form-question-container">
          <h2 class="question-title">¿Cuántas preguntas quieres?</h2>
          <div>
            <label for="range-bar" class="range-bar-number">Número</label>
            <input type="range" id="range-bar" max="30" min="5" class="range-bar"
          </div>
        </div>

        <div class="form-question-container">
          <h2 class="question-title">¿Cuánto tiempo quieres por pregunta?</h2>
          <section id="timers" class="timers">
            <div >
              <input type="radio" name="radio" id="10-seconds" value="10" checked class="check-input">
              <label for="10-seconds" class="label-input">10 seconds</label>
            </div>
            <div>
              <input type="radio" name="radio" id="20-seconds" value="20" class="check-input">
              <label for="20-seconds" class="label-input">20 seconds</label>
            </div>
            <div>
              <input type="radio" name="radio" id="30-seconds" value="30" class="check-input">
              <label for="30-seconds" class="label-input">30 seconds</label>
            </div>
            <div>
              <input type="radio" name="radio" id="60-seconds" value="60" class="check-input">
              <label for="60-seconds" class="label-input">60 seconds</label>
            </div>
          </section>
        </div>
      

        <div class="form-question-container">
          <div class="topic-question-container">
            <h2 class="question-title">¿Qué temas quieres que incluya?</h2>
            <span>Debes escoger al menos una opción</span>
          </div>
          <section id="topics" class="topics-container">
            <div>
              <input type="checkbox" id="science" class="check-input">
              <label for="science" class="label-input">Ciencia</label>
            </div>
            <div>
              <input type="checkbox" id="geography" class="check-input">
              <label for="geography" class="label-input">Geografía</label>
            </div>
            <div>
              <input type="checkbox" id="art" class="check-input">
              <label for="art" class="label-input">Arte</label>
            </div>
            <div>
              <input type="checkbox" id="history" class="check-input">
              <label for="history" class="label-input">Historia</label>
            </div>
            <div>
              <input type="checkbox" id="mythology" class="check-input">
              <label for="mythology" class="label-input">Mitologia</label>
            </div>
            <div>
              <input type="checkbox" id="general" class="check-input">
              <label for="general" class="label-input">Cultura general</label>
            </div>
          </section>
        </div>
        <div>
            <input type="submit" id="play-button" disabled class="play-button">
        </div>
      </form>

    </section>

    <section class="question-container hide" id="question-container">
      <h2>Pregunta</h2>
      <div class="answer-container" id="answer-container">
        <span class="answer">Respuesta 1</span>
        <span class="answer">Respuesta 2</span>
        <span class="answer">Respuesta 3</span>
        <span class="answer">Respuesta 4</span>
      </div>
      <div id="count-down" class="timer">Timer: 20s left</div>
      <button class="next-question-button" id="next-question-button">Next question</button>
    </section>

    <section class="results-container hide" id="results-container">
        <span>Acertaste x</span>
        <span>Fallaste x</span>
        <span>Faltaron x preguntas por responder</span>
    </section>

    </mainc>
    <script src="./js/scripts.js"></script>
  </body>
</html>
